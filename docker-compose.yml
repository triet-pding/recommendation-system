version: '3.8'

services:
  # FastAPI Recommendation Service
  recommendation-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recommendation_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=info
      - WORKERS=1
      - MAX_REQUESTS=1000
      - MAX_REQUESTS_JITTER=100
      - JAVA_HOME=/usr/lib/jvm/default-java
      - PATH=$PATH:/usr/lib/jvm/default-java/bin
    volumes:
      # Mount models directory (if models are large and stored separately)
      - ./models:/app/models:ro
      # Mount logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - recommendation-network

networks:
  recommendation-network:
    driver: bridge